name: Auto Add to Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - name: Add to Project
        uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/Georgia-Tech-GNC/projects/4
          github-token: ${{ secrets.AUTO_ADD_TOKEN }} 
